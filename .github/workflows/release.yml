name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            suffix: ''
          - goos: linux
            goarch: arm64
            suffix: ''
          - goos: darwin
            goarch: amd64
            suffix: ''
          - goos: darwin
            goarch: arm64
            suffix: ''
          - goos: windows
            goarch: amd64
            suffix: '.exe'
          - goos: windows
            goarch: arm64
            suffix: '.exe'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          mkdir -p dist
          go build -ldflags="-s -w" -o dist/commit-gen${{ matrix.suffix }} ./cmd/commit-gen

      - name: Package (Unix)
        if: matrix.goos != 'windows'
        run: |
          cd dist
          tar -czvf commit-gen-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz commit-gen
          rm commit-gen

      - name: Package (Windows)
        if: matrix.goos == 'windows'
        run: |
          cd dist
          zip commit-gen-${{ matrix.goos }}-${{ matrix.goarch }}.zip commit-gen.exe
          rm commit-gen.exe

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: commit-gen-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          draft: false
          prerelease: false
